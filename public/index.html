<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Attendance Management System</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f6f8;
        color: #222;
    }

    header {
        background: #1f4e79;
        color: white;
        padding: 22px;
        text-align: center;
    }

    .container {
        width: 92%;
        max-width: 1100px;
        margin: 25px auto;
    }

    .card {
        background: white;
        padding: 20px;
        margin-bottom: 25px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
        margin-top: 0;
        color: #1f4e79;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    input, select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        padding: 10px 18px;
        background: #1f4e79;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-right: 5px;
    }

    button:hover {
        background: #163a5c;
    }

    .delete {
        background: #c0392b;
    }

    .delete:hover {
        background: #922b21;
    }

    .edit {
        background: #d68910;
    }

    .save {
        background: #218c4a;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 11px;
        border: 1px solid #ddd;
        text-align: center;
    }

    th {
        background: #1f4e79;
        color: white;
    }

    .present {
        color: green;
        font-weight: bold;
    }

    .absent {
        color: red;
        font-weight: bold;
    }

    .message {
        margin-top: 12px;
        font-weight: bold;
    }

    .attendance-form {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        align-items: end;
    }

    @media(max-width: 800px) {
        .form-grid,
        .attendance-form {
            grid-template-columns: 1fr;
        }

        table {
            font-size: 12px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Student Attendance Management System</h1>
    <p>Simple Student and Attendance Management</p>
</header>

<div class="container">

    <!-- ADD STUDENT -->
    <div class="card">
        <h2>Add Student</h2>

        <form id="studentForm">
            <div class="form-grid">

                <input type="text" id="roll_no"
                    placeholder="Roll Number" required>

                <input type="text" id="name"
                    placeholder="Student Name" required>

                <input type="email" id="email"
                    placeholder="Email">

                <input type="text" id="course"
                    placeholder="Course">

                <input type="number" id="semester"
                    placeholder="Semester" min="1" max="8">

            </div>

            <br>

            <button type="submit">Add Student</button>
            <button type="button" onclick="clearForm()">Clear</button>
        </form>

        <p id="studentMessage" class="message"></p>
    </div>


    <!-- STUDENTS -->
    <div class="card">
        <h2>Students</h2>

        <button onclick="loadStudents()">Refresh Students</button>

        <br><br>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Semester</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTable">
                <tr>
                    <td colspan="7">Click Refresh Students</td>
                </tr>
            </tbody>
        </table>
    </div>


    <!-- ATTENDANCE -->
    <div class="card">
        <h2>Mark Attendance</h2>

        <div class="attendance-form">

            <div>
                <label>Student</label>
                <select id="attendanceStudent">
                    <option value="">Select Student</option>
                </select>
            </div>

            <div>
                <label>Subject</label>
                <select id="attendanceSubject">
                    <option value="">Select Subject</option>
                </select>
            </div>

            <div>
                <label>Date</label>
                <input type="date" id="attendanceDate">
            </div>

            <div>
                <label>Status</label>
                <select id="attendanceStatus">
                    <option value="">Select Status</option>
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                </select>
            </div>

        </div>

        <br>

        <button class="save" onclick="saveAttendance()">
            Save Attendance
        </button>

        <p id="attendanceMessage" class="message"></p>
    </div>


    <!-- ATTENDANCE RECORDS -->
    <div class="card">
        <h2>Attendance Records</h2>

        <button onclick="loadAttendance()">
            Refresh Attendance
        </button>

        <br><br>

        <table>
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Subject</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="attendanceTable">
                <tr>
                    <td colspan="5">Click Refresh Attendance</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>


<script>

const API = "http://localhost:3000";

let students = [];
let subjects = [];


// ---------------- STUDENTS ----------------

async function loadStudents() {

    try {

        const response = await fetch(API + "/students");
        students = await response.json();

        const table = document.getElementById("studentTable");

        if (students.length === 0) {
            table.innerHTML =
                `<tr><td colspan="7">No students found.</td></tr>`;
            fillStudentDropdown();
            return;
        }

        table.innerHTML = students.map(student => `
            <tr>
                <td>${student.student_id}</td>
                <td>${student.roll_no}</td>
                <td>${student.name}</td>
                <td>${student.email || "-"}</td>
                <td>${student.course || "-"}</td>
                <td>${student.semester || "-"}</td>

                <td>
                    <button class="edit"
                        onclick="editStudent(${student.student_id})">
                        Edit
                    </button>

                    <button class="delete"
                        onclick="deleteStudent(${student.student_id})">
                        Delete
                    </button>
                </td>
            </tr>
        `).join("");

        fillStudentDropdown();

    } catch (error) {

        document.getElementById("studentTable").innerHTML =
            `<tr><td colspan="7">
                Could not connect to the server.
            </td></tr>`;

        console.error(error);
    }
}


function fillStudentDropdown() {

    const dropdown =
        document.getElementById("attendanceStudent");

    dropdown.innerHTML =
        `<option value="">Select Student</option>`;

    students.forEach(student => {

        dropdown.innerHTML += `
            <option value="${student.student_id}">
                ${student.roll_no} - ${student.name}
            </option>
        `;
    });
}


// ---------------- ADD STUDENT ----------------

document.getElementById("studentForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const data = {

        roll_no: document.getElementById("roll_no").value,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        course: document.getElementById("course").value,
        semester: document.getElementById("semester").value

    };

    try {

        const response = await fetch(API + "/students", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)

        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error);
        }

        document.getElementById("studentMessage")
            .textContent = result.message;

        document.getElementById("studentMessage").style.color =
            "green";

        clearForm();
        loadStudents();

    } catch (error) {

        document.getElementById("studentMessage")
            .textContent = error.message;

        document.getElementById("studentMessage").style.color =
            "red";
    }
});


function clearForm() {

    document.getElementById("studentForm").reset();

}


// ---------------- EDIT STUDENT ----------------

async function editStudent(id) {

    const student =
        students.find(s => s.student_id == id);

    if (!student) return;

    const roll_no = prompt(
        "Roll Number:",
        student.roll_no
    );

    if (roll_no === null) return;

    const name = prompt(
        "Student Name:",
        student.name
    );

    if (name === null) return;

    const email = prompt(
        "Email:",
        student.email || ""
    );

    if (email === null) return;

    const course = prompt(
        "Course:",
        student.course || ""
    );

    if (course === null) return;

    const semester = prompt(
        "Semester:",
        student.semester || ""
    );

    if (semester === null) return;


    try {

        const response = await fetch(
            API + "/students/" + id,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    roll_no,
                    name,
                    email,
                    course,
                    semester
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error);
        }

        alert(result.message);

        loadStudents();

    } catch (error) {

        alert(error.message);

    }
}


// ---------------- DELETE STUDENT ----------------

async function deleteStudent(id) {

    const student =
        students.find(s => s.student_id == id);

    if (!student) return;

    const confirmDelete = confirm(
        "Delete " + student.name + "?"
    );

    if (!confirmDelete) return;

    try {

        const response = await fetch(
            API + "/students/" + id,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error);
        }

        alert(result.message);

        loadStudents();

    } catch (error) {

        alert(error.message);

    }
}


// ---------------- SUBJECTS ----------------

async function loadSubjects() {

    try {

        const response =
            await fetch(API + "/subjects");

        subjects = await response.json();

        const dropdown =
            document.getElementById("attendanceSubject");

        dropdown.innerHTML =
            `<option value="">Select Subject</option>`;

        subjects.forEach(subject => {

            dropdown.innerHTML += `
                <option value="${subject.subject_id}">
                    ${subject.subject_name}
                </option>
            `;
        });

    } catch (error) {

        console.error(error);

    }
}


// ---------------- ATTENDANCE ----------------

async function saveAttendance() {

    const student_id =
        document.getElementById("attendanceStudent").value;

    const subject_id =
        document.getElementById("attendanceSubject").value;

    const attendance_date =
        document.getElementById("attendanceDate").value;

    const status =
        document.getElementById("attendanceStatus").value;


    if (!student_id ||
        !subject_id ||
        !attendance_date ||
        !status) {

        document.getElementById("attendanceMessage")
            .textContent =
            "Please fill all attendance fields.";

        document.getElementById("attendanceMessage")
            .style.color = "red";

        return;
    }


    try {

        const response =
            await fetch(API + "/attendance", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    student_id,
                    subject_id,
                    attendance_date,
                    status
                })

            });


        const result =
            await response.json();

        if (!response.ok) {
            throw new Error(result.error);
        }


        document.getElementById("attendanceMessage")
            .textContent = result.message;

        document.getElementById("attendanceMessage")
            .style.color = "green";

        loadAttendance();

    } catch (error) {

        document.getElementById("attendanceMessage")
            .textContent = error.message;

        document.getElementById("attendanceMessage")
            .style.color = "red";
    }
}


// ---------------- ATTENDANCE TABLE ----------------

async function loadAttendance() {

    try {

        const response =
            await fetch(API + "/attendance");

        const records =
            await response.json();

        const table =
            document.getElementById("attendanceTable");


        if (records.length === 0) {

            table.innerHTML =
                `<tr>
                    <td colspan="5">
                        No attendance records found.
                    </td>
                </tr>`;

            return;
        }


        table.innerHTML =
            records.map(record => `

                <tr>

                    <td>${record.roll_no}</td>

                    <td>${record.name}</td>

                    <td>${record.subject_name}</td>

                    <td>${formatDate(record.attendance_date)}</td>

                    <td class="${
                        record.status === "Present"
                        ? "present"
                        : "absent"
                    }">

                        ${record.status}

                    </td>

                </tr>

            `).join("");


    } catch (error) {

        document.getElementById("attendanceTable")
            .innerHTML =
            `<tr>
                <td colspan="5">
                    Could not connect to the server.
                </td>
            </tr>`;

    }
}


function formatDate(date) {

    if (!date) return "";

    return new Date(date).toLocaleDateString("en-IN");

}


// ---------------- START ----------------

document.addEventListener("DOMContentLoaded", function() {

    loadStudents();
    loadSubjects();
    loadAttendance();

});

</script>

</body>
</html>
